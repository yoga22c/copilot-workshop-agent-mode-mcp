<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f6fb">
    <title>待辦清單</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="todo-card">
      <header class="card-header">
        <p class="eyebrow">今天也一步一步來</p>
        <h1>待辦清單</h1>
        <p class="subtitle">把想做的事記下來，完成一件就勾掉一件。</p>
      </header>

      <form class="todo-form" id="todo-form">
        <label class="visually-hidden" for="todo-input">新增待辦事項</label>
        <input
          id="todo-input"
          name="todo"
          type="text"
          placeholder="接下來想完成什麼？"
          autocomplete="off"
          maxlength="200"
          required
        >
        <button class="add-button" type="submit">
          <span aria-hidden="true">＋</span>
          新增
        </button>
      </form>

      <section class="list-section" aria-label="待辦事項">
        <ul class="todo-list" id="todo-list"></ul>
        <p class="empty-state" id="empty-state">還沒有任何待辦事項,新增一個吧!</p>
      </section>

      <footer class="card-footer">
        <p id="remaining-count" aria-live="polite">未完成:0 項</p>
        <span class="footer-note">每一小步都算數</span>
      </footer>
    </main>
  </body>
</html>
